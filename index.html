<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Guestbook</title>
  <script src="supabase.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>📖 Wedding Guestbook</h1>
    <p class="subtitle">Leave a message for the world to see</p>
  </header>
  
  <form id="guestbook-form">
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Your Name" required autocomplete="off">
    </div>
    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" placeholder="Write a message..." rows="4" required></textarea>
    </div>
    <button type="submit">Sign Guestbook</button>
  </form>

  <div class="divider"></div>

  <div id="messages">
    <div class="loading-text">Loading entries...</div>
  </div>

  <script>
    const SUPABASE_URL = "https://supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_lza6AX0wSCdy-5jG_Fu4ug_Gg0yvIa7";

    const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const form = document.getElementById('guestbook-form');
    const messagesDiv = document.getElementById('messages');

    async function loadMessages() {
      const { data, error } = await supabase
        .from('guestbook')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        messagesDiv.innerHTML = '<div class="empty-text">Error loading entries.</div>';
        return;
      }

      if (data.length === 0) {
        messagesDiv.innerHTML = '<div class="empty-text">No entries yet. Be the first to sign!</div>';
        return;
      }

      messagesDiv.innerHTML = data.map(entry => {
        const formattedDate = new Date(entry.created_at).toLocaleDateString(undefined, {
          month: 'short',
          day: 'numeric',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });

        return `
          <div class="msg-card">
            <div class="msg-header">
              <span class="msg-name">${escapeHtml(entry.name)}</span>
              <span class="msg-date">${formattedDate}</span>
            </div>
            <p class="msg-body">${escapeHtml(entry.message)}</p>
          </div>
        `;
      }).join('');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const message = document.getElementById('message').value;

      const { error } = await supabase
        .from('guestbook')
        .insert([{ name, message }]);

      if (!error) {
        form.reset();
        loadMessages();
      } else {
        alert("Failed to submit entry!");
      }
    });

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    loadMessages();
  </script>
</body>
</html>
