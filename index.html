<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Guestbook</title>
  <script src="supabase.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Floating Professional Emoji Layer Container -->
  <div class="emoji-container" id="emoji-layer"></div>

  <!-- 🔊 Minimal Hidden Audio Element & Floating Action Button -->
  <audio id="bg-audio" loop>
    <source src="wedding.mp3" type="audio/mpeg">
  </audio>
  <button id="audio-btn" class="audio-toggle-btn audio-pulse" onclick="toggleAudio()">
    <span id="audio-icon">🔇</span> <span id="audio-text">Muted</span>
  </button>

  <header>
    <h1>✨ Wedding Guestbook ✨</h1>
    <p class="subtitle">Leave a short message for the wedding couple!</p>
  </header>
  
  <form id="guestbook-form">
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Your Name" required autocomplete="off">
    </div>
    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" placeholder="Write a beautiful wedding wish..." rows="4" required></textarea>
    </div>
    <button type="submit">Sign Guestbook</button>
  </form>

  <div class="divider"></div>

  <div id="messages">
    <div class="loading-text">Loading entries...</div>
  </div>

  <script>
    const SUPABASE_URL = "https://icvkwtiexncitfpymmqm.supabase.co/rest/v1/";
    const SUPABASE_ANON_KEY = "sb_publishable_lza6AX0wSCdy-5jG_Fu4ug_Gg0yvIa7";

    const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const form = document.getElementById('guestbook-form');
    const messagesDiv = document.getElementById('messages');
    const audio = document.getElementById('bg-audio');
    const audioBtn = document.getElementById('audio-btn');
    const audioIcon = document.getElementById('audio-icon');
    const audioText = document.getElementById('audio-text');

    async function loadMessages() {
      const { data, error } = await supabase
        .from('guestbook')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        messagesDiv.innerHTML = '<div class="empty-text">Error loading entries.</div>';
        return;
      }

      if (data.length === 0) {
        messagesDiv.innerHTML = '<div class="empty-text">No entries yet. Be the first to sign!</div>';
        return;
      }

      messagesDiv.innerHTML = data.map(entry => {
        const formattedDate = new Date(entry.created_at).toLocaleDateString(undefined, {
          month: 'short',
          day: 'numeric',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });

        return `
          <div class="msg-card">
            <div class="msg-header">
              <span class="msg-name">${escapeHtml(entry.name)}</span>
              <span class="msg-date">${formattedDate}</span>
            </div>
            <p class="msg-body">${escapeHtml(entry.message)}</p>
          </div>
        `;
      }).join('');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const message = document.getElementById('message').value;

      const { error } = await supabase
        .from('guestbook')
        .insert([{ name, message }]);

      if (!error) {
        form.reset();
        loadMessages();
      } else {
        alert("Failed to submit entry!");
      }
    });

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function generateFloatingEmojis() {
      const layer = document.getElementById('emoji-layer');
      const emojiTypes = ['`💕`', '`💍`', '`✨`', '`🌸`', '`🥂`'];
      const maxCount = 15;

      for (let i = 0; i < maxCount; i++) {
        const emojiElement = document.createElement('div');
        emojiElement.className = 'floating-emoji';
        emojiElement.innerText = emojiTypes[Math.floor(Math.random() * emojiTypes.length)].replace(/`/g, '');
        
        emojiElement.style.left = `${Math.random() * 100}%`;
        emojiElement.style.animationDelay = `${Math.random() * 6}s`;
        emojiElement.style.fontSize = `${Math.random() * (26 - 16) + 16}px`;
        
        layer.appendChild(emojiElement);
      }
    }

    // 🔊 Smart Background Streaming & Interaction Controller
    function toggleAudio() {
      if (audio.paused) {
        audio.play().then(() => {
          audioIcon.innerText = "🔊";
          audioText.innerText = "Playing";
          audioBtn.classList.remove('audio-pulse');
        }).catch(err => console.log("Audio play blocked by browser setup rules."));
      } else {
        audio.pause();
        audioIcon.innerText = "🔇";
        audioText.innerText = "Muted";
        audioBtn.classList.add('audio-pulse');
      }
    }

    // Attempt an instant silent auto-play stream loop upon entry
    window.addEventListener('DOMContentLoaded', () => {
      loadMessages();
      generateFloatingEmojis();
      
      // Auto-play attempt handler
      audio.play().then(() => {
        audioIcon.innerText = "🔊";
        audioText.innerText = "Playing";
        audioBtn.classList.remove('audio-pulse');
      }).catch(() => {
        // If modern security forces a initial mute state, let the button show its active call-to-action pulse
        console.log("Autoplay caught by browser sandbox permissions. User click is required.");
      });
    });
  </script>
</body>
</html>
